name: Compilar liblyron_projectm.so

on:
  workflow_dispatch:   # botão "Run workflow" na aba Actions

env:
  PROJECTM_TAG: v4.1.8
  ANDROID_PLATFORM: android-26

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Baixar projectM ${{ env.PROJECTM_TAG }}
        run: |
          git clone --depth 1 --branch "$PROJECTM_TAG" \
            --recurse-submodules --shallow-submodules \
            https://github.com/projectM-visualizer/projectm.git cpp/projectm

      - name: Compilar (${{ matrix.abi }})
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          cmake -S cpp -B build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=$ANDROID_PLATFORM \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target lyron_projectm -j"$(nproc)"
          mkdir -p out/jniLibs/${{ matrix.abi }}
          cp build/liblyron_projectm.so out/jniLibs/${{ matrix.abi }}/
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded \
            out/jniLibs/${{ matrix.abi }}/liblyron_projectm.so
          ls -l out/jniLibs/${{ matrix.abi }}/

      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ matrix.abi }}
          path: out/jniLibs
